name: Weekly content sync

# Refreshes publications (ORCID), protocol templates + databases.json, and
# network logos (PHD-Center/AsPEN) once a week. Commits + redeploys only when
# something actually changed. Can also be run on demand from the Actions tab.
on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC (10:00 Taiwan)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      scholar_ok: ${{ steps.sync.outputs.scholar_ok }}
      metrics_updated: ${{ steps.sync.outputs.metrics_updated }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sync external content
        id: sync
        run: node scripts/sync-content.mjs
        env:
          # Optional: enables reliable Google Scholar citation/h-index sync from
          # CI (datacenter IPs are blocked from scraping the page directly).
          # Get a free key at serpapi.com and add it as a repo Actions secret.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Detect changes
        id: detect
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes this week."
          fi

      - name: Commit changes
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: weekly content sync (publications, templates, logos)"
          git push

      - name: Build
        if: steps.detect.outputs.changed == 'true'
        run: npm run build

      - name: Upload Pages artifact
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Google blocks Actions' datacenter IPs from time to time, and the sync
  # deliberately keeps the old metrics.json when that happens — so a scrape that
  # has been failing for months still looks like a green run. This job is the
  # alarm. It runs only when Scholar was unreachable, and fails (which is what
  # actually sends an email; warning annotations do not) once the numbers have
  # been frozen for over 4 weeks.
  #
  # It deliberately sits in its own job: `deploy` needs only `sync`, so raising
  # this alarm never blocks the site from publishing real content changes.
  scholar-freshness:
    needs: sync
    if: ${{ !cancelled() && needs.sync.outputs.scholar_ok == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check how long the Scholar metrics have been frozen
        env:
          UPDATED: ${{ needs.sync.outputs.metrics_updated }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATED" ]; then
            echo "::warning title=Scholar unreachable::Could not read the last-updated date from metrics.json."
            exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$UPDATED" +%s) ) / 86400 ))
          echo "Scholar was unreachable this run; metrics last changed $UPDATED ($age days ago)."
          if [ "$age" -gt 28 ]; then
            echo "::error title=Scholar metrics stale::Google Scholar has been unreachable and the citation count has not moved since $UPDATED ($age days). Update src/data/metrics.json by hand, or add a SERPAPI_KEY secret so the sync stops depending on scraping."
            exit 1
          fi
          echo "::warning title=Scholar unreachable this week::Kept the existing metrics (last changed $UPDATED, $age days ago). No action needed unless this keeps happening — this becomes a failure after 28 days."

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
